<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>A.I.G.E. 3D 전시관</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<style>
  body { margin: 0; font-family: 'Noto Sans KR', sans-serif; }

  #ui-overlay {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100; pointer-events: none;
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  #logo {
    pointer-events: auto;
    background: rgba(26,31,46,0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex; gap: 3px;
    font-size: 22px; font-weight: 900;
  }
  .la { color: #5BA4CF; }
  .li { color: #43A89A; }
  .lg { color: #FF7043; }
  .le { color: #F5C842; }

  #controls {
    pointer-events: auto;
    background: rgba(26,31,46,0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 16px;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    line-height: 1.8;
  }

  #info-panel {
    display: none;
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 200;
    background: rgba(26,31,46,0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 24px 28px;
    max-width: 420px; width: 90%;
    color: white;
    text-align: center;
    animation: slideUp .3s ease;
  }
  #info-panel .ip-tag {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px;
  }
  #info-panel .ip-title {
    font-size: 18px; font-weight: 700;
    margin-bottom: 10px; line-height: 1.4;
  }
  #info-panel .ip-desc {
    font-size: 13px; color: rgba(255,255,255,0.65);
    line-height: 1.8; margin-bottom: 16px;
  }
  #info-panel .ip-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; margin-bottom: 16px;
  }
  #info-panel .ip-chip {
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 10px;
  }
  #info-close {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white; font-size: 13px; font-weight: 700;
    padding: 8px 20px; cursor: pointer;
    transition: background .2s;
  }
  #info-close:hover { background: rgba(255,255,255,0.2); }

  .ip-link-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 10px;
    font-size: 12px; font-weight: 700;
    text-decoration: none; color: white;
    margin-bottom: 4px;
  }

  @keyframes slideUp {
    from { opacity:0; transform: translateX(-50%) translateY(20px); }
    to   { opacity:1; transform: translateX(-50%) translateY(0); }
  }

  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 99;
    background: rgba(26,31,46,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px;
    padding: 8px 20px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    pointer-events: none;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:.6; }
    50% { opacity:1; }
  }
</style>
</head>
<body>

<!-- UI -->
<div id="ui-overlay">
  <div id="logo">
    <span class="la">A</span><span style="color:#555">.</span>
    <span class="li">I</span><span style="color:#555">.</span>
    <span class="lg">G</span><span style="color:#555">.</span>
    <span class="le">E</span><span style="color:#555">.</span>
  </div>
  <div id="controls">
    🖱 드래그: 시점 전환<br>
    ⌨ WASD: 이동<br>
    🖱 클릭: 전시물 정보
  </div>
</div>

<div id="hint">🔍 전시물 가까이 다가가 클릭해보세요!</div>

<!-- 정보 패널 -->
<div id="info-panel">
  <div class="ip-tag" id="ip-tag"></div>
  <div class="ip-title" id="ip-title"></div>
  <div class="ip-desc" id="ip-desc"></div>
  <div class="ip-chips" id="ip-chips"></div>
  <div id="ip-link" style="margin-bottom:12px;"></div>
  <button id="info-close" onclick="closeInfo()">닫기</button>
</div>

function showInfo(id) {
  const d = exhibits[id];
  if (!d) return;
  document.getElementById('ip-tag').textContent = d.tag;
  document.getElementById('ip-tag').style.color = d.color;
  document.getElementById('ip-title').textContent = d.title;
  document.getElementById('ip-desc').textContent = d.desc;
  const chipsEl = document.getElementById('ip-chips');
  chipsEl.innerHTML = d.chips.map(c =>
    `<span class="ip-chip" style="background:${d.chipColor};color:${d.chipText}">${c}</span>`
  ).join('');
  const linkEl = document.getElementById('ip-link');
  if (d.link) {
    linkEl.innerHTML = `<a href="${d.link}" target="_blank" class="ip-link-btn" style="background:${d.color}">${d.linkLabel}</a>`;
  } else {
    linkEl.innerHTML = '';
  }
  document.getElementById('info-panel').style.display = 'block';
  document.getElementById('hint').style.display = 'none';
}

function closeInfo() {
  document.getElementById('info-panel').style.display = 'none';
